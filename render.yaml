services:
  # Backend — FastAPI
  - type: web
    name: game-memory-backend
    runtime: python
    rootDir: game-memory-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ANTHROPIC_API_KEY
        sync: false          # введёшь вручную в Render dashboard
      - key: SECRET_KEY
        generateValue: true  # Render сам сгенерирует
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: game-memory-db
          property: connectionString
      - key: CORS_ORIGINS
        value: '["https://game-memory-frontend.onrender.com"]'

  # Frontend — Static HTML
  - type: web
    name: game-memory-frontend
    runtime: static
    rootDir: frontend
    staticPublishPath: .
    routes:
      - type: redirect
        source: /
        destination: /pages/login.html
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache

databases:
  - name: game-memory-db
    databaseName: game_memory_db
    user: game_memory_user